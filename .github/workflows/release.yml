name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          bin="target/${{ matrix.target }}/release/hullcheck"
          tar -C "$(dirname "$bin")" -czf "hullcheck-${{ matrix.target }}.tar.gz" hullcheck
          shasum -a 256 "hullcheck-${{ matrix.target }}.tar.gz" > "hullcheck-${{ matrix.target }}.tar.gz.sha256"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          # Create the release if a parallel matrix job has not already; ignore the
          # "already exists" race so every target can upload into the same release.
          gh release create "$tag" --title "$tag" --generate-notes || true
          gh release upload "$tag" \
            "hullcheck-${{ matrix.target }}.tar.gz" \
            "hullcheck-${{ matrix.target }}.tar.gz.sha256" --clobber
