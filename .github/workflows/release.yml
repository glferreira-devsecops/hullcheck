name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          bin="target/${{ matrix.target }}/release/shipsafe"
          tar -C "$(dirname "$bin")" -czf "shipsafe-${{ matrix.target }}.tar.gz" shipsafe
          shasum -a 256 "shipsafe-${{ matrix.target }}.tar.gz" > "shipsafe-${{ matrix.target }}.tar.gz.sha256"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          # Create the release if a parallel matrix job has not already; ignore the
          # "already exists" race so every target can upload into the same release.
          gh release create "$tag" --title "$tag" --generate-notes || true
          gh release upload "$tag" \
            "shipsafe-${{ matrix.target }}.tar.gz" \
            "shipsafe-${{ matrix.target }}.tar.gz.sha256" --clobber
